# RAI SPA · Sincronizador automático Vicsa ↔ Mercado Libre
#
# Cron:
#   - cada hora:        scraper modo rápido + sync delta (stock/precio)
#   - 06:00 UTC (3am Chile): scraper modo completo + sync de nuevos productos
#
# Persistencia: ml_state.json y ml_pictures_cache.json se commitean al repo
# después de cada corrida exitosa para no re-publicar duplicados.
#
# Secrets requeridos (GitHub → Settings → Secrets → Actions):
#   VICSA_USER, VICSA_PASS
#   ML_APP_ID, ML_CLIENT_SECRET, ML_ACCESS_TOKEN, ML_REFRESH_TOKEN, ML_USER_ID

name: RAI SPA · Sync Vicsa ↔ ML

on:
  # CRON DESACTIVADO: el piloto está pausado mientras se evalúa el modelo de
  # negocio con proveedor distinto a Vicsa. Para reactivar, descomentar la línea.
  # schedule:
  #   - cron: '0 6 * * *'   # 06:00 UTC = 03:00 Chile, una vez al día
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecución'
        required: true
        default: 'completo'
        type: choice
        options: [rapido, completo]

permissions:
  contents: write   # necesario para hacer git push del state actualizado

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Decidir modo
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modo=${{ github.event.inputs.modo }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "modo=completo" >> $GITHUB_OUTPUT
          else
            echo "modo=rapido" >> $GITHUB_OUTPUT
          fi

      # Descargar el catálogo completo más reciente (cualquier run anterior).
      # El modo rápido lo usa como baseline para calcular el delta.
      - name: Descargar catálogo previo
        run: |
          mkdir -p output_vicsa
          URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=catalogo-completo&per_page=1" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=d.get('artifacts',[]); print(a[0]['archive_download_url']) if a and not a[0].get('expired') else print('')")
          if [ -n "$URL" ]; then
            curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o /tmp/cat.zip "$URL"
            unzip -q /tmp/cat.zip -d output_vicsa/ 2>/dev/null && echo "Catálogo previo OK." || echo "Sin catálogo válido."
          else
            echo "Sin artifact de catálogo. Modo rápido caerá a completo."
          fi

      - name: Renovar Access Token
        id: token
        run: |
          RESP=$(curl -s -X POST "https://api.mercadolibre.com/oauth/token" \
            -d "grant_type=refresh_token&client_id=${{ secrets.ML_APP_ID }}&client_secret=${{ secrets.ML_CLIENT_SECRET }}&refresh_token=${{ secrets.ML_REFRESH_TOKEN }}")
          AT=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$AT" ]; then echo "ERROR token: $RESP"; exit 1; fi
          echo "::add-mask::$AT"
          echo "access_token=$AT" >> $GITHUB_OUTPUT

      - name: Scraper Vicsa
        id: scraper
        env:
          VICSA_USER: ${{ secrets.VICSA_USER }}
          VICSA_PASS: ${{ secrets.VICSA_PASS }}
        run: |
          mkdir -p output_vicsa
          MODO="${{ steps.modo.outputs.modo }}"
          if [ "$MODO" = "rapido" ] && [ -z "$(ls output_vicsa/catalogo_vicsa_*.json 2>/dev/null)" ]; then
            echo "Sin baseline para rápido → corriendo completo."
            MODO="completo"
          fi
          echo "modo_efectivo=$MODO" >> $GITHUB_OUTPUT
          if [ "$MODO" = "completo" ]; then
            python scraper_v13.py --categorias "Calzado de Seguridad"
          else
            python scraper_v13.py --modo rapido --categorias "Calzado de Seguridad"
          fi

      - name: Scraper tbpass (HW)
        env:
          TBPASS_USER:     ${{ secrets.TBPASS_USER }}
          TBPASS_PASS:     ${{ secrets.TBPASS_PASS }}
          TBPASS_HEADLESS: 'true'
        run: |
          # No falla todo el job si tbpass falla — el sync funciona igual
          python scraper_tbpass.py || echo "WARN: scraper_tbpass falló, sigo sin overlay"

      - name: Sync con ML
        env:
          ML_APP_ID:        ${{ secrets.ML_APP_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN:  ${{ steps.token.outputs.access_token }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_USER_ID:       ${{ secrets.ML_USER_ID }}
        run: |
          MODO="${{ steps.scraper.outputs.modo_efectivo }}"
          if [ "$MODO" = "completo" ]; then
            JSON=$(ls -t output_vicsa/catalogo_vicsa_*.json | head -1)
            python sync_ml.py --json "$JSON" --categorias "Calzado de Seguridad"
          else
            DELTA=$(ls -t output_vicsa/stock_delta_*.json 2>/dev/null | head -1)
            if [ -n "$DELTA" ]; then
              python sync_ml.py --delta "$DELTA"
            else
              echo "Sin delta para procesar."
            fi
          fi

      # Guardar el catálogo completo como artifact (para que el próximo run rápido lo use)
      - name: Persistir catálogo
        if: steps.scraper.outputs.modo_efectivo == 'completo'
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-completo
          path: output_vicsa/catalogo_vicsa_*.json
          retention-days: 7
          overwrite: true

      - name: Commit state actualizado
        run: |
          git config user.name  "rai-spa-bot"
          git config user.email "bot@raispa.cl"
          git add output_vicsa/ml_state.json output_vicsa/ml_pictures_cache.json output_vicsa/tbpass_storage.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar state ML [skip ci]"
            git push
          fi
